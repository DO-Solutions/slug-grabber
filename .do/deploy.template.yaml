spec:
  name: do-slug-grabber
  region: lon
  services:
  - name: slug-grabber
    http_port: 8080
    dockerfile_path: /Dockerfile
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
    - key: DO_CLIENT_ID
      scope: RUN_TIME
      type: SECRET
      value: ""
    - key: DO_CLIENT_SECRET
      scope: RUN_TIME
      type: SECRET
      value: ""
    - key: SESSION_SECRET
      scope: RUN_TIME
      type: SECRET
      value: "" # generate: openssl rand -hex 32
    - key: SESSION_ENCRYPTION_KEY
      scope: RUN_TIME
      type: SECRET
      value: "" # generate: openssl rand -hex 32
    - key: SPACES_KEY
      scope: RUN_TIME
      type: SECRET
      value: ""
    - key: SPACES_SECRET
      scope: RUN_TIME
      type: SECRET
      value: ""
    - key: SPACES_ENDPOINT
      scope: RUN_TIME
      value: "https://nyc3.digitaloceanspaces.com"
    - key: SPACES_BUCKET
      scope: RUN_TIME
      value: "slug-grabber-sessions"
    - key: APP_URL
      scope: RUN_TIME
      value: "" # e.g. https://slug-grabber.ondigitalocean.app
    - key: MAX_SESSIONS
      scope: RUN_TIME
      value: "50"
    git:
      branch: main
      repo_clone_url: https://github.com/DO-Solutions/slug-grabber.git
    source_dir: /
